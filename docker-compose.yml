services:
  postgres:
    image: postgres:16-alpine
    container_name: lastseat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lastseat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lastseat_password}
      POSTGRES_DB: ${POSTGRES_DB:-lastseat_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lastseat} -d ${POSTGRES_DB:-lastseat_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lastseat-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lastseat-api
    restart: unless-stopped
    env_file:
      - .env.example
    environment:
      DATABASE_URL: "postgresql+asyncpg://lastseat:lastseat_password@postgres:5432/lastseat_db"
      REDIS_URL: "redis://redis:6379/0"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lastseat-streamlit
    restart: unless-stopped
    command: ["streamlit", "run", "app.py", "--server.port=8501", "--server.address=0.0.0.0", "--server.headless=true"]
    environment:
      BACKEND_URL: "http://api:8000"
      PARTNER_API_KEY: "sk-partner-charter-secret-key-2026"
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
