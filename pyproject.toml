[project]
name = "flight-smart-booking-poc"
version = "0.1.0"
description = "POC fonctionnel et prêt pour la production (FastAPI, Streamlit, Redis Streams, PostgreSQL Async) pour l'ingestion de billets d'avion de dernière minute et l'achat autonome par agent logiciel."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "redis>=5.1.1",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "httpx>=0.27.2",
    "python-dotenv>=1.0.1",
    "streamlit>=1.39.0",
    "requests>=2.32.3",
    "streamlit-autorefresh>=1.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["SIM117"]
